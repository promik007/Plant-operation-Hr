<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Plant Operation</title>
<style>
:root{--bg:#eef2f7;--card:#ffffff;--tx:#0f1b2d;--mu:#64748b;--bd:#dbe3ee;--ac:#0b6bcb;--ac2:#0891b2;--ok:#0a7d4f;--sh:0 2px 10px rgba(15,27,45,.07);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b1119;--card:#151e2b;--tx:#e6edf6;--mu:#93a1b5;--bd:#25324a;--ac:#4a9dff;--ac2:#22c3e6;--ok:#3ccf82;--sh:0 2px 10px rgba(0,0,0,.35);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0b1119;--card:#151e2b;--tx:#e6edf6;--mu:#93a1b5;--bd:#25324a;--ac:#4a9dff;--ac2:#22c3e6;--ok:#3ccf82;--sh:0 2px 10px rgba(0,0,0,.35);color-scheme:dark}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.hero{background:linear-gradient(135deg,#0b3a75,#0891b2);color:#fff;padding:22px 16px 56px}
.hero .in{max-width:520px;margin:0 auto}
.brand{display:flex;align-items:center;gap:12px}
.logo{width:42px;height:42px;border-radius:12px;background:rgba(255,255,255,.18);display:grid;place-items:center;font-size:22px}
.hero h1{margin:0;font-size:22px}
.hero p{margin:2px 0 0;opacity:.85;font-size:13px}
.w{max-width:520px;margin:-40px auto 0;padding:0 14px 24px}
.c{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:18px;margin-bottom:12px;box-shadow:var(--sh)}
.t{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--mu);margin:0 0 10px}
.tm{display:flex;align-items:center;gap:8px;margin-bottom:16px}
.tm:last-of-type{margin-bottom:0}
.tm .lb{width:54px;font-weight:700}
.tm input{flex:1;min-width:0;width:100%;text-align:center;font:700 26px system-ui,sans-serif;color:var(--tx);background:var(--bg);border:1px solid var(--bd);border-radius:12px;padding:12px 4px;outline:none}
.tm input:focus{border-color:var(--ac)}
.tm b{font-size:26px;color:var(--mu)}
.hint{color:var(--mu);font-size:12px;text-align:center;margin-top:10px}
.res{text-align:center}
.res .n{font-size:56px;font-weight:800;color:var(--ok);line-height:1.1}
.res .u{color:var(--mu);font-weight:600}
.res .s{margin-top:6px;color:var(--mu);font-size:14px;min-height:20px}
button{width:100%;margin-top:14px;font:inherit;font-weight:600;color:var(--tx);background:var(--bg);border:1px solid var(--bd);border-radius:10px;padding:11px;cursor:pointer}
.tm button.nw{width:auto;margin:0;padding:12px 14px;color:var(--ac);border-color:var(--ac);font-weight:700}
button#clr{background:linear-gradient(135deg,var(--ac),var(--ac2));border:none;color:#fff;font-weight:700;padding:13px}
</style>
</head>
<body>
<div class="hero"><div class="in">
<div class="brand"><div class="logo">⚡</div><div><h1>Plant Operation</h1><p>Engine Running Hours</p></div></div>
</div></div>

<div class="w">
<div class="c">
<p class="t">Engine Time (24 h)</p>
<div class="tm"><span class="lb">Start</span><input id="sh" inputmode="numeric" maxlength="2" placeholder="HH"><b>:</b><input id="sm" inputmode="numeric" maxlength="2" placeholder="MM"><button class="nw" data-h="sh" data-m="sm">Now</button></div>
<div class="tm"><span class="lb">Stop</span><input id="ph" inputmode="numeric" maxlength="2" placeholder="HH"><b>:</b><input id="pm" inputmode="numeric" maxlength="2" placeholder="MM"><button class="nw" data-h="ph" data-m="pm">Now</button></div>
<div class="hint">Hour 00-23, minute 00-59. If stop is earlier than start, it counts past midnight.</div>
</div>

<div class="c res">
<p class="t">Total Running Hours</p>
<div><span class="n" id="n">0.00</span> <span class="u">hours</span></div>
<div class="s" id="s"></div>
<button id="clr">Clear Data</button>
</div>
</div>

<script>
function $(i){return document.getElementById(i)}
var ids=["sh","sm","ph","pm"],max={sh:23,sm:59,ph:23,pm:59};
function val(id){var v=$(id).value;return v===""?null:parseInt(v,10)}
function calc(){
var a=val("sh"),b=val("sm"),c=val("ph"),d=val("pm");
if(a===null||c===null){$("n").textContent="0.00";$("s").textContent="";return}
var st=a*60+(b||0),sp=c*60+(d||0),m=sp-st;if(m<0)m+=1440;
$("n").textContent=(m/60).toFixed(2);
$("s").textContent=Math.floor(m/60)+" h "+String(m%60).padStart(2,"0")+" min"}
ids.forEach(function(id,i){var el=$(id);
el.addEventListener("input",function(){
var v=el.value.replace(/\D/g,"").slice(0,2);
if(v!==""&&parseInt(v,10)>max[id])v=String(max[id]);
el.value=v;calc();
if(v.length===2&&i<3)$(ids[i+1]).focus()});
el.addEventListener("focus",function(){el.select()});
el.addEventListener("blur",function(){if(el.value.length===1)el.value="0"+el.value;calc()})});
$("clr").onclick=function(){ids.forEach(function(id){$(id).value=""});calc();$("sh").focus()};
document.querySelectorAll(".nw").forEach(function(b){b.onclick=function(){var t=new Date();$(b.dataset.h).value=String(t.getHours()).padStart(2,"0");$(b.dataset.m).value=String(t.getMinutes()).padStart(2,"0");calc()}});
</script>
</body>
</html>
